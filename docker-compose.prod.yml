# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Uses the `prod` image target (built assets, no dev deps, opcache on), no bind
# mounts, real S3 (+ CloudFront via AWS_URL / ASSET_URL), and disables the
# dev-only services (vite, minio, mailpit).

x-prod-app: &prod-app
  build:
    context: .
    target: prod
  image: ${APP_IMAGE:-bdlg-app:prod}
  env_file: .env
  volumes: !reset []
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_OPTIMIZE: "1"
  restart: always

services:
  app:
    <<: *prod-app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_OPTIMIZE: "1"
      APP_BOOTSTRAP: "0"
    depends_on: !override
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    # nginx needs the built public/ assets: serve them from the app image.
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ${NGINX_IMAGE:-bdlg-nginx:prod}
    volumes: !reset []
    ports: !override
      - "${APP_PORT:-80}:80"
    restart: always

  horizon:
    <<: *prod-app
    command: ["php", "artisan", "horizon"]
    shm_size: 1gb

  scheduler:
    <<: *prod-app
    command: ["php", "artisan", "schedule:work"]

  mysql:
    ports: !reset []
    restart: always

  redis:
    restart: always

  vite:
    profiles: ["dev"]
  minio:
    profiles: ["dev"]
  minio-init:
    profiles: ["dev"]
  mailpit:
    profiles: ["dev"]
