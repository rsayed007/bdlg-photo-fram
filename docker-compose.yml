name: bdlg

x-app: &app
  build:
    context: .
    target: dev
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  image: bdlg-app:dev
  env_file: .env
  volumes:
    - .:/var/www/html
    # vendor/ lives in a named volume: much faster than a Windows/macOS bind mount.
    - vendor:/var/www/html/vendor
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      APP_BOOTSTRAP: "1"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    depends_on:
      app: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "true"]
    depends_on:
      app: { condition: service_healthy }

  vite:
    image: node:20-bookworm-slim
    working_dir: /var/www/html
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_IN_DOCKER: "1"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor:ro
      - node_modules:/var/www/html/node_modules
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bdlg}
      MYSQL_USER: ${DB_USERNAME:-bdlg}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${FORWARD_DB_PORT:-13306}:3306"
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-testing-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # MinIO's own images are no longer published (Docker Hub/quay). The frozen
  # Bitnami build is still real MinIO and ships the `mc` client too.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio-secret}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: bitnamilegacy/minio:2025.5.24
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio-secret}
      AWS_BUCKET: ${AWS_BUCKET:-bdlg}
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  vendor:
  node_modules:
  mysql:
  redis:
  minio:
