name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Pint · Larastan · Pest
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bdlg_testing
          MYSQL_USER: bdlg
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootsecret"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same image as local dev: PHP 8.3 + imagick/libheif + Chromium + fonts.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: bdlg-app:ci
          build-args: |
            UID=1001
            GID=118
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare
        run: |
          cp .env.example .env
          echo "RUN=docker run --rm --network host -v ${{ github.workspace }}:/var/www/html -e DB_HOST=127.0.0.1 -e REDIS_HOST=127.0.0.1 -e AWS_ENDPOINT= --entrypoint= bdlg-app:ci" >> "$GITHUB_ENV"
          sudo chown -R 1001:118 .

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: $RUN composer install --no-interaction --prefer-dist --no-progress

      - name: App key
        run: $RUN php artisan key:generate --force

      - name: Pint
        run: $RUN ./vendor/bin/pint --test

      - name: Larastan
        run: $RUN ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest (unit, feature, browser)
        run: $RUN ./vendor/bin/pest

  frontend:
    name: ESLint · Prettier · TypeScript · Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Vite aliases ziggy-js to vendor/tightenco/ziggy.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - run: composer install --no-interaction --no-scripts --no-progress --ignore-platform-reqs

      - run: npm ci

      - run: npm run lint:check

      - run: npm run format:check

      - run: npm run types

      - run: npm run build
